<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 WiFi Setup</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 40px; background-color: #f4f4f9; }
        .card { background: white; padding: 25px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 85%; max-width: 300px; }
        input { margin: 10px 0; padding: 10px; width: 90%; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { padding: 10px; background-color: #04AA6D; color: white; border: none; border-radius: 5px; width: 90%; cursor: pointer; font-weight: bold; }
        #status { margin-top: 15px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Wi-Fi Setup</h2>
        <form id="wifiForm">
            <input type="text" id="ssid" name="ssid" placeholder="Wi-Fi Name (SSID)" required><br>
            <input type="password" id="pass" name="pass" placeholder="Password" required><br>
            <button type="submit">Save & Connect</button>
        </form>
        <p id="status"></p>
    </div>

    <script>
        document.getElementById('wifiForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Stop normal form submit
            
            const status = document.getElementById('status');
            status.innerText = "Connecting... Please wait!";
            status.style.color = "#007bff";

            const formData = new FormData();
            formData.append('ssid', document.getElementById('ssid').value);
            formData.append('pass', document.getElementById('pass').value);

            // Send Wi-Fi credentials to ESP32 /save endpoint
            fetch('/save', { method: 'POST', body: formData })
                .then(response => response.text())
                .then(data => {
                    status.innerText = data;
                    status.style.color = "#04AA6D";
                })
                .catch(err => {
                    status.innerText = "Failed to send credentials!";
                    status.style.color = "red";
                });
        });
    </script>
</body>
</html>
